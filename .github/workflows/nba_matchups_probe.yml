name: NBA matchups probe (one-off)

on:
  push:
    branches: [claude/nba-matchups-test]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pipeline.nba_matchups_probe || true
      - name: Commit the answers to this branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/log/nba_matchups_probe
          git diff --cached --quiet && exit 0
          git commit -m "NBA matchups probe"
          git push
