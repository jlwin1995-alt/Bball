name: Refresh data and deploy

on:
  schedule:
    - cron: "17 9 * * *"      # daily, ~5am ET, after the previous night's games are final
    - cron: "47 10 * * *"     # backups: GitHub's scheduler is best-effort and skipped the first 09:17 run, so run again twice.
    - cron: "17 12 * * *"     # Extra runs are cheap (incremental fetch, no Odds API credits) and commit only if something changed.
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Fetch box scores, schedule, injuries
        # DATA_SOURCE is a repository variable: "espn" (default) or "nba_api".
        # nba_api is often blocked from GitHub-hosted runners; if so, run it locally and commit data/raw.
        run: python -m pipeline.fetch_${{ vars.DATA_SOURCE || 'espn' }}   # first run backfills last season; includes preseason games until CUR_START
      - name: Update shot locations
        # ESPN play-by-play shot coordinates (one summary call per new game); soft-fail so it can never block the refresh
        run: python -m pipeline.fetch_shots || echo "::warning::shot locations could not be updated"
      - name: Learn preseason minutes (once, before the season; cached in data/raw)
        run: test -f data/raw/preseason_minutes.json || python -m pipeline.preseason_minutes || echo "::warning::preseason minutes could not be learned; the site uses a rough default"
      - name: Fit spreads for the Lines tab
        run: python -m pipeline.backtest --every 5 --write-spread
      - name: Build site data (and log the next slate before tip-off)
        run: python -m pipeline.build
      - name: Commit data
        # If main moved while this job ran (a re-run of an old commit, or a merge mid-run), rebase our freshly
        # generated data onto it instead of failing. Only data/ and site/data/ are touched, and where both sides
        # changed a generated file, ours (the newer build) wins.
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet && exit 0
          git commit -m "Refresh data"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not push the data commit after 3 attempts"; exit 1
      - run: scripts/stage_pages.sh       # basketball at /, football at /football/ (one Pages artifact serves both)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}   # unique per attempt: a Re-run must not find 2 artifacts
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
