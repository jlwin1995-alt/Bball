name: Football refresh data and deploy

# nflverse publishes box scores, the schedule, snap counts and injuries as release CSVs (no key, no rate limit). This rebuilds the football site's
# data and redeploys. The accuracy log only ever grows: a week's projections are written ONCE, before its games, and never rewritten.
on:
  schedule:
    - cron: "27 9 * * *"      # daily, ~5:30am ET
    - cron: "57 10 * * *"     # backups: GitHub's scheduler is best-effort and skips runs. Extra runs are cheap and commit only if something changed.
    - cron: "27 12 * * *"
    - cron: "17 18 * * 2"     # Tuesday afternoon: nflverse's player stats for Monday night often land after the morning runs
    - cron: "47 15 * * 0"     # Sunday late morning: final inactives/injury designations and a fresh kickoff-weather forecast
    - cron: "47 22 * * 3"     # Wednesday evening: first full injury report
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh              # shared with the basketball workflows so two deploys never race
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}      # optional: without it the college steps just skip
    defaults:
      run:
        working-directory: football
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: football/pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Fetch box scores, schedule, snap counts, injuries
        run: python -m pipeline.fetch
      - name: College data (CollegeFootballData; skips without CFBD_API_KEY, and spends 1 call when nothing new has finished)
        run: python -m pipeline.cfb_data || echo "::warning::college data could not be updated"
      - name: Backtest last season (once; the result is committed)
        run: |
          S=$(python -c "from pipeline import config as C; print(C.SEASON - 1)")
          test -f site/data/backtest_$S.json || { python -m pipeline.fetch --season $S && python -m pipeline.backtest --season $S --write; } || echo "::warning::backtest could not be built"
      - name: Build site data (and log the week before kickoff)
        run: python -m pipeline.build
      - name: Build college data (and log the week before kickoff)
        run: |
          python -m pipeline.cfb_build || echo "::warning::college build failed"
          python -m pipeline.cfb_build --backtest || true
      - name: Commit data
        # If main moved while this job ran, rebase our freshly generated data onto it instead of failing. Only football/data and
        # football/site/data are touched, and where both sides changed a generated file, ours (the newer build) wins.
        working-directory: .
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add football/data football/site/data
          git diff --cached --quiet && exit 0
          git commit -m "Refresh football data"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not push the football data commit after 3 attempts"; exit 1
      - run: scripts/stage_pages.sh
        working-directory: .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
