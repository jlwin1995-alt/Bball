name: Football college history (manual)

# One-off: fetch earlier seasons' college box scores (about 17 CFBD calls per season) into football/data/raw/cfb_hist so the player model can be
# tested against the closing lines. Re-running costs 1 call per season once everything is stored. Needs the CFBD_API_KEY secret.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to fetch, space separated"
        default: "2025 2024"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    defaults:
      run:
        working-directory: football
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: football/pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Fetch the seasons
        run: |
          for S in ${{ github.event.inputs.seasons }}; do
            python -m pipeline.cfb_data --season $S --hist cfb_hist
          done
      - name: Commit data
        working-directory: .
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add football/data
          git diff --cached --quiet && exit 0
          git commit -m "College history box scores"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not push"; exit 1
