name: Deploy site

# Merging a change to the site code (site/** or football/site/**) publishes it. The data workflows deploy too, but only when they run;
# without this, a merged UI change would sit on main until the next scheduled refresh.
# (Commits pushed by the data workflows use GITHUB_TOKEN and do not trigger this, so there is no loop.)
on:
  push:
    branches: [main]
    paths: ["site/**", "football/site/**", "scripts/stage_pages.sh"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refresh              # serialise with the data workflows so two deploys never race
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/stage_pages.sh       # basketball at /, football at /football/ (one Pages artifact serves both)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
