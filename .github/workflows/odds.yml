name: Refresh odds

# Pulls NBA player-prop lines (sportsbooks + PrizePicks/Underdog) from The Odds API several times on game days,
# rebuilds site/data/lines.json, and redeploys. Needs the repository secret ODDS_API_KEY; without it this just skips.
on:
  schedule:
    # GitHub's scheduler is best-effort (it skipped and delayed runs here), so every pull has a backup ~35 min later. fetch_odds skips
    # a run if the previous check was under 90 min ago, so backups only spend credits when the first run did not happen.
    - cron: "5 14 * * *"      # ~10am ET: books start posting props
    - cron: "40 14 * * *"     # backup
    - cron: "5 16 * * *"      # ~noon ET
    - cron: "40 16 * * *"     # backup
    - cron: "5 21 * * *"      # ~5pm ET
    - cron: "40 21 * * *"     # backup
    - cron: "35 23 * * *"     # ~7:35pm ET: close to the first tip
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh              # same group as the daily refresh so the two never push at once
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - name: Check for the API key
        id: key
        run: |
          if [ -z "$ODDS_API_KEY" ]; then echo "::notice::ODDS_API_KEY secret is not set; skipping odds refresh"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.skip != '1'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.skip != '1'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - if: steps.key.outputs.skip != '1'
        run: pip install -r pipeline/requirements.txt
      - name: Fetch lines (the events list is free; props cost credits per game)
        if: steps.key.outputs.skip != '1'
        run: python -m pipeline.fetch_odds ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}   # manual runs always pull
      - name: Build lines.json
        if: steps.key.outputs.skip != '1'
        run: python -m pipeline.lines
      - name: Commit data
        if: steps.key.outputs.skip != '1'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet && exit 0
          git commit -m "Refresh odds"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not push the odds commit after 3 attempts"; exit 1
      - uses: actions/upload-pages-artifact@v3
        if: steps.key.outputs.skip != '1'
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}   # unique per attempt: a Re-run must not find 2 artifacts
      - uses: actions/deploy-pages@v4
        if: steps.key.outputs.skip != '1'
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
