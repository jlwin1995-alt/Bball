name: Refresh odds

# Pulls NBA player-prop lines (sportsbooks + PrizePicks) from The Odds API twice a day (7 am ET and 2 hours before the first tip),
# rebuilds site/data/lines.json, and redeploys. Needs the repository secret ODDS_API_KEY; without it this just skips.
on:
  schedule:
    # Two runs a day, decided by pipeline/gate.py (Eastern time and the real first tip, which cron cannot express):
    #   7 am ET, and 2 hours before the day's first tip. Each run pulls odds, then triggers the data refresh.
    # The gate job ticks every 30 minutes and ends in seconds when there is nothing to do (no credits). GitHub's scheduler is
    # best-effort, so several ticks fall inside each window; the gate makes sure it fires once.
    # GitHub skips or delays many scheduled runs (Oct 23: only 2 of ~26 ticks ran overnight and none of the 7 am ones), so tick every 15 minutes.
    - cron: "*/15 11-23 * * *"   # 7 am ET (daylight time; 6 am standard) through 7 pm ET: morning run, then pre-tip checks
    - cron: "*/15 0-2 * * *"     # ... and into the late evening
  workflow_dispatch:
    inputs:
      probe:
        description: "Diagnose instead of pull: list what the API has for the next game (spends a few credits; commits and deploys nothing)"
        type: boolean
        default: false
      hours:
        description: "Manual pull: how many hours ahead to pull games (blank = the usual 18). Costs about 8 credits per game"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write              # the scheduled run triggers the data refresh

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      fire: ${{ steps.g.outputs.fire }}
      key: ${{ steps.g.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "fire=1" >> "$GITHUB_OUTPUT"; echo "key=" >> "$GITHUB_OUTPUT"; else python3 pipeline/gate.py decide >> "$GITHUB_OUTPUT"; fi

  odds:
    needs: gate
    if: needs.gate.outputs.fire == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: refresh          # same group as the data refresh so the two never push at once
      cancel-in-progress: false
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - name: Check for the API key
        id: key
        run: |
          if [ -z "$ODDS_API_KEY" ]; then echo "::notice::ODDS_API_KEY secret is not set; skipping odds refresh"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.skip != '1'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.skip != '1'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - if: steps.key.outputs.skip != '1'
        run: pip install -r pipeline/requirements.txt
      - name: Probe the API (manual run with the 'probe' box ticked)
        if: steps.key.outputs.skip != '1' && github.event.inputs.probe == 'true'
        run: python -m pipeline.fetch_odds --probe
      - name: Fetch lines (the events list is free; props cost credits per game)
        if: steps.key.outputs.skip != '1' && github.event.inputs.probe != 'true'
        env:
          ODDS_HORIZON_HOURS: ${{ github.event.inputs.hours }}
        run: python -m pipeline.fetch_odds --force   # the gate already limits scheduled runs to twice a day, so every run that gets here pulls
      - name: Build lines.json
        if: steps.key.outputs.skip != '1' && github.event.inputs.probe != 'true'
        run: python -m pipeline.lines
      - name: Mark this scheduled run as done
        if: steps.key.outputs.skip != '1' && needs.gate.outputs.key != ''
        run: python3 pipeline/gate.py record "${{ needs.gate.outputs.key }}"
      - name: Commit data
        if: steps.key.outputs.skip != '1' && github.event.inputs.probe != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet && exit 0
          git commit -m "Refresh odds"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not push the odds commit after 3 attempts"; exit 1
      - run: scripts/stage_pages.sh
        if: steps.key.outputs.skip != '1' && github.event.inputs.probe != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.key.outputs.skip != '1' && github.event.inputs.probe != 'true'
        with:
          path: _pages
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}   # unique per attempt: a Re-run must not find 2 artifacts
      - uses: actions/deploy-pages@v4
        if: steps.key.outputs.skip != '1' && github.event.inputs.probe != 'true'
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Trigger the data refresh (scheduled runs only)
        if: steps.key.outputs.skip != '1' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh.yml --ref main
