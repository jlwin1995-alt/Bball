name: Football tests

on:
  pull_request:
    paths: ["football/**", "scripts/stage_pages.sh"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: football
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: football/pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Odds parser, name matching and consensus maths (offline)
        run: python -m pipeline.selftest
      - name: Browser arithmetic matches the pipeline
        run: node site/test/parity.mjs
      - name: Lines probability maths
        run: node site/test/lines.mjs
      - name: Pipeline builds from the committed raw data
        run: python -m pipeline.build --no-log --no-weather --out "$RUNNER_TEMP/site_data"
